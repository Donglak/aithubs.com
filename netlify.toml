[build]
  command = "npm run build"
  publish = "dist"

  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

[dev]
  functions = "netlify/functions"
  publish = "dist"
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888


[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

